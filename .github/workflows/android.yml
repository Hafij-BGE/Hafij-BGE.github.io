name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        id: key
        env:
          RL_SIGNING: ${{ secrets.RL_SIGNING }}
        run: |
          cd android
          echo "KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
          if [ -n "$RL_SIGNING" ]; then
            PW="${RL_SIGNING%%:*}"
            echo "::add-mask::$PW"
            printf '%s' "${RL_SIGNING#*:}" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            PW="temp-$(date +%s)"
            keytool -genkeypair -keystore release.keystore -storetype PKCS12 -alias researchlog \
              -keyalg RSA -keysize 2048 -validity 365 -storepass "$PW" -keypass "$PW" -dname "CN=Temporary"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RL_SIGNING secret is not set, so this APK uses a temporary key and is not published as a release."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            MSG=$( { sed -n '/What went wrong/,/Try:/p' build.log; echo '----- last lines -----'; tail -n 25 build.log; } | head -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$MSG"
            exit 1
          fi

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk research-log.apk
          keytool -printcert -jarfile research-log.apk | grep -i sha256 || true
          ls -la research-log.apk
          rm -f android/release.keystore   # never leave the key on disk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-log-apk
          path: research-log.apk

      - name: Publish release
        if: steps.key.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Research Log for Android (build ${{ github.run_number }})
          body: |
            Download **research-log.apk** below and open it on your Android phone to install.
            The app opens https://hafij-bge.github.io/tracker/ full-screen, so it always matches the website.
          files: research-log.apk
          make_latest: true
